seed: 123
use_gpu: True
device: 0
early_stop:
  patience: 0
federate:
  freeze_A: False
  alternate_training: False
  alternate_communication: True
  mode: standalone
  client_num: 3
  total_round_num: 1000
  save_to: "fedsa-lora_a2_mnli-m.ckpt"
  share_local_model: True
  online_aggr: False
personalization: 
  local_param: ['classifier']
data:
  root: data/
  type: 'mnli@glue'
  matched: True
  splitter: 'iid'
  #splitter_args: [{'alpha': 0.5}]
llm:
  tok_len: 128
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
#  deepspeed:
#    use: True
#    ds_config: federatedscope/glue/yamls/ds_config_zero2_cpuoffload.json
dataloader:
  batch_size: 8
model:
  type: 'FacebookAI/roberta-large@huggingface_llm'
train:
  local_update_steps: 3
  batch_or_epoch: batch
  optimizer:
    type: SGD
    lr: 2e-2
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: lora2gluetrainer
eval:
  freq: 1
  metrics: ['accuracy']
  count_flops: False
  best_res_update_round_wise_key: 'val_accuracy'
wandb:
  use: True